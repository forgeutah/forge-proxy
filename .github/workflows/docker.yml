# Docker image workflow: builds a multi-arch image and pushes it to GitHub
# Container Registry (ghcr.io) on every commit to main, plus on every v*
# tag.
#
# Pulls (once the package is set to public — one-time manual step the first
# time, see README "Docker alternative" section):
#   docker pull ghcr.io/forgeutah/forge-proxy:latest
#   docker pull ghcr.io/forgeutah/forge-proxy:v0.1.0
#
# The release.yml workflow handles standalone binaries; this one is the
# container path. Both can fire on the same v* tag without conflict.

name: docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  # contents: read so the workflow can checkout source.
  contents: read
  # packages: write so the auto-injected GITHUB_TOKEN can push to ghcr.io
  # under the same org/user as the repository. No PAT needed.
  packages: write

jobs:
  build-and-push:
    name: build and push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + buildx is the multi-arch build pipeline. QEMU registers
      # cross-arch emulators with the kernel; buildx is the docker plugin
      # that drives multi-arch + caching. Our Dockerfile uses BUILDPLATFORM
      # and TARGETARCH so the actual compile is native cross-compile, not
      # qemu — but we still need buildx to produce the multi-arch manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is auto-injected and has the packages:write scope
      # granted by the permissions block above. No PAT required.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the image tag list from the git ref. Main pushes get
      # `latest`, `main`, and `sha-<short>`; v* tag pushes get the full
      # semver (v1.2.3), the major.minor rolling tag (v1.2), the major
      # rolling tag (v1), AND `latest` (since the tag is on the default
      # branch). Operators pin to whichever level of stability they want.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 + linux/arm64 matches the binary release matrix.
          # No darwin: distroless/static is linux-only, and macOS hosts
          # don't typically run server containers in prod.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend keeps layer reuse between runs
          # tight. mode=max writes every layer (not just final), which is
          # what we want when the build stage and runtime stage differ.
          cache-from: type=gha
          cache-to: type=gha,mode=max
